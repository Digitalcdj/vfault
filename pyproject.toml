[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vfault"
version = "0.1.0"
description = "Catches AI hallucinations in WordPress code. Deterministic verification against actual source."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Ian Fraser"}]
keywords = ["ai", "hallucination", "wordpress", "verification", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Digitalcdj/vfault"
Repository = "https://github.com/Digitalcdj/vfault"
Issues = "https://github.com/Digitalcdj/vfault/issues"
